<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password · Portfolio CMS</title>
  <meta name="description" content="Change your Portfolio CMS admin password." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/change-password.css">
</head>
<body>

  <!-- TOAST ROOT -->
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <!-- ANIMATED BACKGROUND -->
  <div class="login-bg">
    <div class="login-bg-orb login-bg-orb--1"></div>
    <div class="login-bg-orb login-bg-orb--2"></div>
    <div class="login-bg-orb login-bg-orb--3"></div>
  </div>

  <!-- ═══════ CHANGE PASSWORD VIEW ═══════ -->
  <div id="changePasswordView" class="login-view">
    <div class="login-card">
      <!-- Brand -->
      <div class="login-brand"><span>&lt;</span> CMS Admin <span>/&gt;</span></div>
      <h1><i class="fas fa-shield-alt heading-icon"></i> Change Password</h1>
      <p class="login-sub">Verify your identity with your current password, then set a new one.</p>

      <!-- Change Password Form -->
      <form id="changePasswordForm" autocomplete="off">

        <!-- Email -->
        <label for="cpEmail">Email</label>
        <input type="email" id="cpEmail" required autocomplete="email" placeholder="admin@example.com">

        <!-- Old Password -->
        <label for="cpOldPassword">Current Password</label>
        <div class="password-wrap">
          <input type="password" id="cpOldPassword" required autocomplete="current-password" placeholder="Enter your current password">
          <button type="button" class="pw-toggle" data-target="cpOldPassword" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <div class="form-divider">
          <span>New Credentials</span>
        </div>

        <!-- New Password -->
        <label for="cpNewPassword">New Password</label>
        <div class="password-wrap">
          <input type="password" id="cpNewPassword" required autocomplete="new-password" placeholder="Enter new password" minlength="6">
          <button type="button" class="pw-toggle" data-target="cpNewPassword" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <!-- Password Strength Indicator -->
        <div class="password-strength" id="passwordStrength">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <span class="strength-text" id="strengthText"></span>
        </div>

        <!-- Confirm Password -->
        <label for="cpConfirmPassword">Confirm New Password</label>
        <div class="password-wrap">
          <input type="password" id="cpConfirmPassword" required autocomplete="new-password" placeholder="Re-enter new password" minlength="6">
          <button type="button" class="pw-toggle" data-target="cpConfirmPassword" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <!-- Match indicator -->
        <div class="match-indicator" id="matchIndicator" hidden>
          <i class="fas fa-check-circle"></i> Passwords match
        </div>
        <div class="mismatch-indicator" id="mismatchIndicator" hidden>
          <i class="fas fa-times-circle"></i> Passwords do not match
        </div>

        <p id="cpError" class="form-error" hidden></p>
        <p id="cpSuccess" class="form-success" hidden></p>

        <button type="submit" class="btn btn-primary btn-full" id="changePasswordBtn">
          <i class="fas fa-lock"></i> Update Password
        </button>
      </form>

      <p class="login-hint">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>
