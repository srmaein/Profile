<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · Portfolio CMS</title>
  <meta name="description" content="Sign in to the Portfolio CMS Admin dashboard to manage your projects." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- TOAST ROOT -->
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <!-- ANIMATED BACKGROUND -->
  <div class="login-bg">
    <div class="login-bg-orb login-bg-orb--1"></div>
    <div class="login-bg-orb login-bg-orb--2"></div>
    <div class="login-bg-orb login-bg-orb--3"></div>
  </div>

  <!-- ═══════ LOGIN VIEW ═══════ -->
  <div id="loginView" class="login-view">
    <div class="login-card">
      <!-- Brand -->
      <div class="login-brand"><span>&lt;</span> CMS Admin <span>/&gt;</span></div>
      <h1>Sign in</h1>
      <p class="login-sub">Enter your admin credentials to access the dashboard.</p>

      <!-- Login Form -->
      <div id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="email" placeholder="admin@example.com">

        <label for="loginPassword">Password</label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••••••">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <!-- Forgot Password Link -->
        <div class="forgot-password-wrap">
          <a href="change-password.html" class="forgot-link" id="forgotPasswordLink">
            <i class="fas fa-key"></i> Forgot / Change Password?
          </a>
        </div>

        <button type="button" class="btn btn-primary btn-full" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </div>

      <p id="loginError" class="form-error" hidden></p>

      <p class="login-hint">
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to site</a>
      </p>
    </div>
  </div>

  <!-- LOADING OVERLAY (shown during auto-login redirect) -->
  <div id="loadingOverlay" class="loading-overlay" hidden>
    <div class="loading-spinner">
      <i class="fas fa-circle-notch fa-spin"></i>
      <span>Checking session...</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
